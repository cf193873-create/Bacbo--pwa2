<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#0b1020">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Bac Bo Signal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080d19;
      color: #fff;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 15px;
    }

    header {
      text-align: center;
      padding: 15px 5px 20px;
    }

    header h1 {
      font-size: 27px;
      margin-bottom: 6px;
    }

    header p {
      color: #8e9bb5;
      font-size: 13px;
    }

    .signal-box {
      background: linear-gradient(145deg, #121a2d, #0e1526);
      border: 1px solid #263452;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      margin-bottom: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,.25);
    }

    .signal-label {
      color: #8e9bb5;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #signal {
      font-size: 38px;
      font-weight: bold;
      margin: 8px 0;
    }

    #confidence {
      color: #aeb9cf;
      font-size: 14px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .result-btn {
      border: 0;
      border-radius: 15px;
      min-height: 70px;
      color: white;
      font-size: 27px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(0,0,0,.25);
    }

    .result-btn:active {
      transform: scale(.96);
    }

    .player {
      background: #1976d2;
    }

    .banker {
      background: #d32f2f;
    }

    .tie {
      background: #757575;
    }

    .card {
      background: #10182a;
      border: 1px solid #24314d;
      border-radius: 17px;
      padding: 16px;
      margin-bottom: 15px;
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 13px;
    }

    .history {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 45px;
    }

    .ball {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.12);
    }

    .ball.p {
      background: #1976d2;
    }

    .ball.b {
      background: #d32f2f;
    }

    .ball.e {
      background: #757575;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      background: #151f34;
      border-radius: 12px;
      padding: 13px 5px;
      text-align: center;
    }

    .stat-value {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .stat-name {
      color: #8e9bb5;
      font-size: 11px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .control-btn {
      background: #1a2439;
      color: white;
      border: 1px solid #30405f;
      border-radius: 12px;
      padding: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .control-btn:active {
      transform: scale(.98);
    }

    .empty {
      color: #68758e;
      font-size: 13px;
      text-align: center;
      width: 100%;
      padding: 12px 0;
    }

    .status {
      text-align: center;
      color: #7887a3;
      font-size: 11px;
      margin-top: 18px;
      padding-bottom: 10px;
    }

    @media (max-width: 360px) {
      .app {
        padding: 10px;
      }

      header h1 {
        font-size: 23px;
      }

      .result-btn {
        min-height: 62px;
      }

      .ball {
        width: 34px;
        height: 34px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>🎲 BAC BO SIGNAL</h1>
    <p>Análise estatística das jogadas</p>
  </header>

  <section class="signal-box">
    <div class="signal-label">Sinal atual</div>

    <div id="signal">AGUARDANDO</div>

    <div id="confidence">
      Introduza os resultados para iniciar a análise
    </div>
  </section>

  <section class="buttons">

    <button
      class="result-btn player"
      onclick="addResult('P')">
      P
    </button>

    <button
      class="result-btn banker"
      onclick="addResult('B')">
      B
    </button>

    <button
      class="result-btn tie"
      onclick="addResult('E')">
      E
    </button>

  </section>

  <section class="card">

    <div class="card-title">
      Histórico
    </div>

    <div id="history" class="history">
      <div class="empty">
        Nenhum resultado registado
      </div>
    </div>

  </section>

  <section class="card">

    <div class="card-title">
      Estatísticas
    </div>

    <div class="stats">

      <div class="stat">
        <div id="playerCount" class="stat-value">0</div>
        <div class="stat-name">PLAYER</div>
      </div>

      <div class="stat">
        <div id="bankerCount" class="stat-value">0</div>
        <div class="stat-name">BANKER</div>
      </div>

      <div class="stat">
        <div id="tieCount" class="stat-value">0</div>
        <div class="stat-name">EMPATE</div>
      </div>

    </div>

  </section>

  <section class="card">

    <div class="card-title">
      Controlo
    </div>

    <div class="controls">

      <button
        class="control-btn"
        onclick="undoResult()">
        ↩️ Desfazer
      </button>

      <button
        class="control-btn"
        onclick="clearHistory()">
        🗑️ Limpar
      </button>

    </div>

  </section>

  <div class="status">
    Bac Bo Signal • análise estatística local
  </div>

</div>

<script src="app.js"></script>

</body>
  </html>
